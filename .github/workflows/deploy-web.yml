name: Publier le coefficient de pêche

on:
  push:
    branches: [claude/fishing-point-app-clone-io5qc3]
    paths:
      - 'FishingCoef/web/glenan.html'
      - 'FishingCoef/web/icon-*.png'
      - 'FishingCoef/web/sw.js'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La page est autonome : aucune dépendance, aucune étape de compilation.
      # On l'assemble simplement dans le squelette HTML attendu par un navigateur.
      # OpenStreetMap porte les objets des cartes marines saisis par les
      # contributeurs d'OpenSeaMap. C'est le seul jeu libre et interrogeable
      # qui dise ce qu'il y a au fond du secteur. Le relevé se fait ici parce
      # que le runner a un accès réseau, et son échec ne doit pas casser le
      # déploiement : la page fonctionne sans.
      - name: Relever le relief du fond
        continue-on-error: true
        run: |
          BBOX="47.62,-4.25,47.95,-3.65"
          TYPES="^(wreck|obstruction|shoal|reef|rock)$"
          read -r -d '' Q <<EOF || true
          [out:json][timeout:120];
          (
            node["seamark:type"~"$TYPES"]($BBOX);
            way["seamark:type"~"$TYPES"]($BBOX);
            node["historic"="wreck"]($BBOX);
            way["historic"="wreck"]($BBOX);
            node["natural"~"^(reef|shoal|bank)$"]($BBOX);
            way["natural"~"^(reef|shoal|bank)$"]($BBOX);
          );
          out center tags;
          EOF
          curl -sS --max-time 180 --retry 2 --retry-delay 10 \
            -H 'User-Agent: coef-peche-glenan (deploiement GitHub Pages)' \
            --data-urlencode "data=$Q" \
            https://overpass-api.de/api/interpreter -o overpass.json || echo '{}' > overpass.json
          echo "réponse Overpass : $(wc -c < overpass.json) octets"
          python3 FishingCoef/tools/seabed.py < overpass.json > seabed.js
          head -c 300 seabed.js; echo

      # Grille de profondeurs EMODnet (~115 m de maille), analysée pour en
      # tirer les secs et les tombants. La zone déborde volontairement celle
      # de la carte : la mesure du fond alentour a besoin de marge, sans quoi
      # les reliefs proches du bord seraient invisibles.
      - name: Chercher les secs et les tombants
        continue-on-error: true
        run: |
          python3 -m pip install --quiet numpy rasterio
          curl -sS --max-time 240 --retry 2 --retry-delay 10 \
            -H 'User-Agent: coef-peche-glenan (deploiement GitHub Pages)' \
            -o bathy.tif \
            'https://ows.emodnet-bathymetry.eu/wcs?service=WCS&version=1.0.0&request=GetCoverage&coverage=emodnet:mean&crs=EPSG:4326&bbox=-4.29,47.59,-3.61,47.98&format=image/tiff&width=653&height=374' \
            || true
          echo "grille reçue : $(wc -c < bathy.tif 2>/dev/null || echo 0) octets"
          file bathy.tif || true
          python3 FishingCoef/tools/bathy.py bathy.tif > bathy.js
          head -c 200 bathy.js; echo

      - name: Assembler le site
        run: |
          mkdir -p site
          [ -s seabed.js ] || echo 'window.__SEABED__ = [];' > seabed.js
          [ -s bathy.js ]  || echo 'window.__BATHY__ = [];'  > bathy.js
          cp FishingCoef/web/icon-*.png site/
          cp FishingCoef/web/sw.js site/
          cat > site/manifest.webmanifest <<'JSON'
          {
            "name": "Coef de pêche — Fouesnant · Les Glénan",
            "short_name": "Coef pêche",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0A1C27",
            "theme_color": "#0A1C27",
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png" }
            ]
          }
          JSON
          {
            printf '%s\n' '<!doctype html>'
            printf '%s\n' '<html lang="fr">'
            printf '%s\n' '<head>'
            printf '%s\n' '<meta charset="utf-8">'
            printf '%s\n' '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '%s\n' '<meta name="apple-mobile-web-app-capable" content="yes">'
            printf '%s\n' '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
            printf '%s\n' '<meta name="apple-mobile-web-app-title" content="Coef pêche">'
            printf '%s\n' '<meta name="theme-color" content="#0A1C27">'
            printf '%s\n' '<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">'
            printf '%s\n' '<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">'
            printf '%s\n' '<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">'
            printf '%s\n' '<link rel="manifest" href="manifest.webmanifest">'
            printf '%s\n' '</head>'
            printf '%s\n' '<body>'
            printf '%s\n' '<script>'
            cat seabed.js
            cat bathy.js
            printf '%s\n' '</script>'
            cat FishingCoef/web/glenan.html
            printf '%s\n' '</body>'
            printf '%s\n' '</html>'
          } > site/index.html
          test -s site/index.html
          grep -q 'Fouesnant' site/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
